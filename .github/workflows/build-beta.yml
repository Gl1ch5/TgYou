name: Build beta

on:
  push:
    branches: [main, 'ccr-*']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a prerelease with this tag (e.g. v0.1.0-beta1); empty = build only'
        required: false
        default: ''

permissions:
  contents: write

# A new push waits for the running build instead of cancelling it, so a cold native build
# can finish and save its cache. Release runs have their own group.
concurrency:
  group: build-beta-${{ github.ref }}-${{ inputs.release_tag || 'ci' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: TG_API_ID
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Add TG_API_ID and TG_API_HASH secrets"; exit 1
          fi

      # The C++ part only changes with the sources under jni/, so its output is cached.
      - name: Native cache key
        id: nkey
        run: echo "hash=$(git ls-tree -r HEAD TMessagesProj/jni .gitmodules | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"

      - name: Restore prebuilt native libs
        id: native
        uses: actions/cache@v4
        with:
          path: native-libs
          key: native-arm64-${{ steps.nkey.outputs.hash }}

      - name: Submodules
        run: |
          # Java modules are always needed
          git submodule update --init TMessagesProj_Modules/media TMessagesProj/lib/jlatexmath
          # C++ sources only when the native libs have to be built
          if [ "${{ steps.native.outputs.cache-hit }}" != "true" ]; then
            git submodule update --init --recursive
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4

      - name: ccache
        if: steps.native.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          key: ccache-arm64
          max-size: 1500M

      - name: Build APK
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_RELEASE_TAG: ${{ inputs.release_tag }}
          # betas are arm64 only
          TG_ABIS: arm64-v8a
          # branch builds skip R8; release builds are minified
          TG_FAST: ${{ (inputs.release_tag == '' && !startsWith(github.ref, 'refs/tags/')) && '1' || '' }}
          TG_PREBUILT_JNI: ${{ steps.native.outputs.cache-hit == 'true' && format('{0}/native-libs', github.workspace) || '' }}
          TG_CCACHE: '1'
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,pch_defines
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --build-cache --stacktrace

      - name: Save native libs for the next runs
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          lib=$(find . -path '*stripped_native_libs*' -path '*lib/arm64-v8a/libtmessages.49.so' | head -1)
          [ -n "$lib" ] || lib=$(find . -path '*/obj/arm64-v8a/libtmessages.49.so' | head -1)
          if [ -z "$lib" ]; then
            echo "::warning::libtmessages.49.so not found, native cache will not be saved"
            exit 0
          fi
          mkdir -p native-libs/arm64-v8a
          cp "$lib" native-libs/arm64-v8a/
          ls -l native-libs/arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-you-beta
          path: TMessagesProj_App/build/outputs/apk/**/*.apk

      # Readable notes: the subjects of the commits since the previous release, shown as a list in the app
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          prev=$(gh api "repos/${{ github.repository }}/releases?per_page=30" --jq '[.[] | select(.tag_name != env.TAG) | .tag_name][0]' || true)
          {
            echo "## Что нового"
            if [ -n "$prev" ]; then
              gh api "repos/${{ github.repository }}/compare/${prev}...${{ github.sha }}" \
                --jq '[.commits[].commit.message | split("\n")[0] | select(startswith("Merge") | not)] | reverse | .[:20][] | "- " + .' || true
              echo
              echo "Full Changelog: https://github.com/${{ github.repository }}/compare/${prev}...${TAG}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Telegram You ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: TMessagesProj_App/build/outputs/apk/**/*.apk
